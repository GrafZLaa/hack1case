services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: passport-cif-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
      FLASK_DEBUG: 0
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "5000:5000"
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: passport-cif-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
